name: Deploy Pumpkin server

# Installs a `pumpkin` binary built by build-linux.yml onto a Calagopus
# Pumpkin host and smoke-tests it. Manual dispatch only.
#
# SAFETY (learned on PatchBukkit):
# - installs to `pumpkin.real`, never touches the `./pumpkin` wrapper script
# - backs up the running binary to `pumpkin.real.bak-<ts>` first (rollback:
#   rename back + restart, no CI needed)
# - writes `.signals/.deploy-notice-start.json` BEFORE mutating anything and
#   `-done.json` at the end (deploy-watch janitor flags start-without-done)
# - propagates the remote exit code (a swallowing `echo` once hid exit 139)
# - the test runs `timeout 90 ./pumpkin`; exit 124 (timeout) = healthy boot
# - Configure SSH is non-fatal (continue-on-error); ssh-add is re-checked and
#   the deploy branches to a stage-only API fallback when no key is loaded
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VM_SSH_PRIVATE_KEY, VM_SUDO_PASSWORD, VM_PORT, VM_USER,
#   CALAGOPUS_API_KEY (panel signed-URL fallback),
#   PLAYASIA_DISCORD_WEBHOOK (optional, empty = skip).
#
# All seven secrets exist on this fork (verified 2026-09-05). Deploy run #1
# failed because the VM_SSH_PRIVATE_KEY VALUE does not parse ("error in
# libcrypto" from ssh-add) — owner must re-import the key. While broken, the
# job does NOT die at Configure SSH: it falls back to a signed-URL upload that
# stages the binary at the volume root (pumpkin.staged-<ts>) and exits
# non-zero so a partial deploy is never reported green.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build/deploy (branch, tag, or SHA)'
        required: false
        default: 'master'
      target:
        description: 'Which server to deploy to'
        required: true
        type: choice
        options:
          - pumpkin-dev
          - p-lobby
        default: 'pumpkin-dev'
      skip_test:
        description: 'Install only, skip the 90s smoke test'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-pumpkin-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      VM_PORT: ${{ secrets.VM_PORT }}
      VM_USER: ${{ secrets.VM_USER }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve target
        id: target
        run: |
          case "${{ inputs.target }}" in
            pumpkin-dev)
              echo "sid=0663eb80-d3b8-45bd-86b1-579098d1f653" >> "$GITHUB_OUTPUT"
              echo "port=25553" >> "$GITHUB_OUTPUT"
              ;;
            p-lobby)
              echo "sid=9b3a9d1f-904b-4f73-b526-93072f65595e" >> "$GITHUB_OUTPUT"
              echo "port=25554" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Download latest build artifact for ref
        id: dl
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build-linux.yml
          workflow_search: true
          workflow_conclusion: success
          branch: ${{ inputs.ref }}
          name: pumpkin-linux-*
          name_is_regexp: true
          path: artifact
          search_artifacts: true
          check_artifacts: true
          if_no_artifact_found: warn

      - name: Locate binary
        run: |
          ls -R artifact 2>&1 | head -n 50 || true
          ART_BIN=$(find artifact -type f -name "pumpkin" 2>/dev/null | head -n 1)
          if [ -z "$ART_BIN" ]; then echo "ERROR: pumpkin binary not found in artifact"; exit 1; fi
          echo "ART_BIN=$ART_BIN ($(stat -c%s "$ART_BIN"))"
          echo "ART_BIN=$ART_BIN" >> "$GITHUB_ENV"
          test -s "$ART_BIN" || { echo "ERROR: empty binary"; exit 1; }

      - name: Configure SSH
        id: ssh
        # run #1 (2026-09-05) died here: ssh-add failed 'error in libcrypto' (malformed
        # VM_SSH_PRIVATE_KEY value). Never hard-fail before the fallback can run.
        continue-on-error: true
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      - name: Check SSH agent
        id: sshcheck
        run: |
          set +e
          if ssh-add -l >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "SSH agent ready (key loaded)"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SSH agent has no usable key (ssh-add failed) — API fallback will stage the binary"
          fi

      - name: Trust VM host key
        env:
          VM_PORT: ${{ secrets.VM_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${VM_PORT:-2222}" -t ed25519 15.235.204.178 2>/dev/null | head -n 1 > ~/.ssh/known_hosts || true
          cat ~/.ssh/known_hosts

      - name: Deploy to host (SSH primary, API fallback for transport)
        env:
          VM_SUDO_PASSWORD: ${{ secrets.VM_SUDO_PASSWORD }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          CALAGOPUS_API_KEY: ${{ secrets.CALAGOPUS_API_KEY }}
          PLAYASIA_DISCORD_WEBHOOK: ${{ secrets.PLAYASIA_DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          PORT="${VM_PORT:-2222}"
          SID="${{ steps.target.outputs.sid }}"
          if [ "${{ steps.sshcheck.outputs.available }}" = "true" ]; then
          echo "== SSH path: scp + remote sudo install + smoke test =="
          set +e
          scp -P "$PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            "$ART_BIN" "${VM_USER}@15.235.204.178:~/pumpkin.new" 2>&1 | tail -n 3
          SCP_EXIT=${PIPESTATUS[0]}
          echo "SCP_EXIT=$SCP_EXIT"
          if [ $SCP_EXIT -ne 0 ]; then echo "SCP failed; continuing — remote install step will report"; fi
          {
            printf '%s\n' "$VM_SUDO_PASSWORD"
            cat <<'REMOTE'
          set -euo pipefail
          vol=/var/lib/calagopus-wings/volumes/__SID__
          ls -lh /home/ghosty/pumpkin.new ~/pumpkin.new 2>&1 || echo "checking staged binary"
          SRC_BIN=""; for p in /home/ghosty/pumpkin.new ~/pumpkin.new; do [ -f "$p" ] && SRC_BIN="$p" && break; done
          if [ -z "$SRC_BIN" ]; then echo "ERROR: staged pumpkin binary not found"; exit 1; fi
          # Deploy-start marker FIRST (deploy-watch janitor flags start-without-done).
          mkdir -p "$vol/.signals" 2>&1 || true
          echo "{\"bin\":\"pumpkin-$(date -u +%Y%m%d%H%M%S)\",\"by\":\"github-actions/${GITHUB_SHA:-unknown}\"}" > "$vol/.signals/.deploy-notice-start.json" || true
          # Rollback copy of the running binary (rename back + restart to revert).
          if [ -f "$vol/pumpkin.real" ]; then cp -a "$vol/pumpkin.real" "$vol/pumpkin.real.bak-$(date -u +%Y%m%d%H%M%S)"; ls "$vol"/pumpkin.real.bak-* 2>&1 | tail -n 3; fi
          # Install as pumpkin.real so a wrapper at ./pumpkin keeps working.
          # Fresh volume without wrapper: install straight to ./pumpkin.
          if [ -f "$vol/pumpkin" ] && head -c 2 "$vol/pumpkin" | grep -q '#!'; then
            install -m 0755 "$SRC_BIN" "$vol/pumpkin.real"
          else
            install -m 0755 "$SRC_BIN" "$vol/pumpkin"
          fi
          chmod +x "$vol/pumpkin" "$vol/pumpkin.real" 2>/dev/null || true
          ls -lh "$vol/pumpkin" "$vol/pumpkin.real" 2>&1 || true
          if [ "${{ inputs.skip_test }}" = "true" ]; then echo "skip_test=true — installed only"; echo "{\"bin\":\"pumpkin\",\"by\":\"github-actions\"}" > "$vol/.signals/.deploy-notice-done.json" || true; exit 0; fi
          set +e
          docker run --rm --entrypoint "" -v "$vol":/home/container -w /home/container ghcr.io/ptero-eggs/yolks:java_25 bash -c 'timeout 90 ./pumpkin 2>&1 | tee /home/container/pumpkin-deploy-test.log; echo EXIT_CODE:${PIPESTATUS[0]} > /home/container/pumpkin-exit-code.log'
          PUMPKIN_EXIT=$(cat "$vol/pumpkin-exit-code.log" 2>/dev/null || echo "unknown")
          echo "Pumpkin exit: $PUMPKIN_EXIT"
          grep -c "Server is now running" "$vol/pumpkin-deploy-test.log" 2>&1 || echo "no running line"
          tail -n 30 "$vol/pumpkin-deploy-test.log" 2>&1 || true
          ls -lh "$vol"/hs_err*.log "$vol"/core* 2>&1 || echo "No hs_err/core in vol"
          echo "{\"bin\":\"pumpkin\",\"by\":\"github-actions\"}" > "$vol/.signals/.deploy-notice-done.json" || true
          if [ -n "${PLAYASIA_DISCORD_WEBHOOK:-}" ]; then MSG=":package: [Pumpkin ${{ inputs.target }}] pumpkin $(date -u +%Y-%m-%dT%H:%M:%SZ) exit $PUMPKIN_EXIT by github-actions/${GITHUB_SHA:-unknown}"; curl -sS -X POST -H "Content-Type: application/json" -d "{\"content\":\"$MSG\"}" "$PLAYASIA_DISCORD_WEBHOOK" || true; fi
          test "${PUMPKIN_EXIT#EXIT_CODE:}" -eq 124
          REMOTE
          } | sed "s/__SID__/${{ steps.target.outputs.sid }}/" | ssh -p "${PORT:-2222}" -o StrictHostKeyChecking=no "${VM_USER}@15.235.204.178" 'sudo -S bash -s'
          SSH_EXIT=${PIPESTATUS[1]:-1}
          echo "SSH deploy exit=$SSH_EXIT"
          exit $SSH_EXIT
          fi

          echo "== SSH unavailable — Calagopus API fallback (stage-only; never a silent green) =="
          CALAGOPUS_PANEL="${CALAGOPUS_PANEL:-https://panel.playasia.online}"
          # Deploy-start marker via API (telemetry; non-fatal).
          python3 - <<'PYEOF' >/dev/null 2>&1 || true
          import json, os, urllib.request, urllib.parse
          sid = os.environ["SID"]; key = os.environ["CALAGOPUS_API_KEY"]; panel = os.environ["CALAGOPUS_PANEL"]
          content = json.dumps({"bin": "pumpkin-staged", "by": "github-actions", "transport": "api-fallback"})
          for path in ("/.signals/.deploy-notice-start.json", "/.deploy-notice-start.json"):
              try:
                  url = panel + "/api/client/servers/" + sid + "/files/write?" + urllib.parse.urlencode({"file": path})
                  req = urllib.request.Request(url, data=content.encode(), method="PUT", headers={"Authorization": "Bearer " + key, "Content-Type": "text/plain"})
                  urllib.request.urlopen(req, timeout=30); break
              except Exception:
                  pass
          PYEOF
          # Signed-URL upload straight into the server volume root.
          TS=$(date -u +%Y%m%d%H%M%S)
          STAGED="pumpkin.staged-$TS"
          cp "$ART_BIN" "./$STAGED"
          SIGNED=$(curl -sf -H "Authorization: Bearer $CALAGOPUS_API_KEY" "$CALAGOPUS_PANEL/api/client/servers/$SID/files/upload?directory=%2F") || { echo "::error::signed-URL request failed"; exit 1; }
          UPLOAD_URL=$(printf '%s' "$SIGNED" | python3 -c 'import sys,json
          d=json.load(sys.stdin)
          def find(o):
              if isinstance(o,str): return o if o.startswith("http") else None
              if isinstance(o,dict):
                  for v in o.values():
                      r=find(v)
                      if r: return r
              if isinstance(o,list):
                  for v in o:
                      r=find(v)
                      if r: return r
              return None
          print(find(d))')
          [ -n "$UPLOAD_URL" ] || { echo "::error::could not extract signed upload URL"; exit 1; }
          curl -sf -F "files=@./$STAGED" "${UPLOAD_URL}&directory=%2F" || { echo "::error::API upload failed"; exit 1; }
          # Size verification (panel uploads truncate ~100MB; pumpkin nightly is ~13MB — mismatch = real error).
          LOCAL_SIZE=$(stat -c%s "./$STAGED")
          LIST_JSON=$(curl -sf -H "Authorization: Bearer $CALAGOPUS_API_KEY" "$CALAGOPUS_PANEL/api/client/servers/$SID/files/list?directory=%2F&per_page=100") || LIST_JSON=""
          REMOTE_SIZE=$(LIST_JSON="$LIST_JSON" STAGED="$STAGED" python3 - <<'PYEOF'
          import json, os
          if not os.environ.get("LIST_JSON"):
              print(""); raise SystemExit
          d = json.loads(os.environ["LIST_JSON"]); name = os.environ["STAGED"]
          def walk(o):
              if isinstance(o, dict):
                  if o.get("name") == name or o.get("attributes", {}).get("name") == name:
                      yield o
                  else:
                      for v in o.values():
                          yield from walk(v)
              elif isinstance(o, list):
                  for v in o:
                      yield from walk(v)
          for x in walk(d):
              attr = x.get("attributes", x)
              print(attr.get("size", "")); break
          else:
              print("")
          PYEOF
          )
          if [ -z "$REMOTE_SIZE" ]; then
            echo "::warning::staged file not found in volume listing — verify manually"
          elif [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
            echo "::error::upload truncated: local=$LOCAL_SIZE remote=$REMOTE_SIZE"
            exit 1
          else
            echo "upload verified: /$STAGED = $REMOTE_SIZE bytes"
          fi
          if [ -n "${PLAYASIA_DISCORD_WEBHOOK:-}" ]; then curl -sS -X POST -H "Content-Type: application/json" -d "{\"content\":\":warning: [Pumpkin ${{ inputs.target }}] SSH unavailable — binary STAGED at /$STAGED (install NOT done) by github-actions/${GITHUB_SHA:-unknown}\"}" "$PLAYASIA_DISCORD_WEBHOOK" || true; fi
          echo "::error::SSH transport unavailable (ssh-add failure). Binary staged at /$STAGED in the volume — INSTALL NOT DONE."
          echo "::error::Fix VM_SSH_PRIVATE_KEY (deploy run #1: 'error in libcrypto'; key re-import needed) and re-dispatch, or install manually via panel Files (rename /$STAGED over pumpkin.real, chmod 755, restart)."
          exit 1

      - name: Fetch diagnostics
        if: always()
        env:
          VM_SUDO_PASSWORD: ${{ secrets.VM_SUDO_PASSWORD }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set +e
          if ! ssh-add -l >/dev/null 2>&1; then
            echo "SSH unavailable — skipping remote diagnostics (see deploy step for staged-binary note)"
            exit 0
          fi
          PORT="${VM_PORT:-2222}"
          mkdir -p diagnostics
          {
            printf '%s\n' "$VM_SUDO_PASSWORD"
            cat <<'REMOTE'
          vol=/var/lib/calagopus-wings/volumes/__SID__
          cat "$vol"/pumpkin-deploy-test.log 2>&1 | tail -n 200 || true
          ls -lh "$vol"/hs_err*.log "$vol"/core* "$vol"/pumpkin*.log 2>&1 || true
          REMOTE
          } | sed "s/__SID__/${{ steps.target.outputs.sid }}/" | ssh -p "${PORT:-2222}" -o StrictHostKeyChecking=no "${VM_USER}@15.235.204.178" 'sudo -S bash -s' | tee diagnostics/remote.log || true
          ls -lh diagnostics/ || true

      - name: Upload deploy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-deploy-diagnostics-${{ inputs.target }}-${{ github.sha }}
          if-no-files-found: ignore
          path: diagnostics/
          retention-days: 7
