name: Build Linux server

# Fast Linux-only build of the `pumpkin` server binary for our Calagopus
# hosts (x86_64). This is the artifact producer for deploy-pumpkin-*.yml
# and release-fork.yml. Kept separate from upstream rust.yml/release.yml
# (untouched, for clean merges) and scoped to what we actually deploy.
#
# Required repo secrets: none beyond GITHUB_TOKEN.

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'feat/**'
      - 'diag/**'
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/build-linux.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pumpkin-linux
          cache-all-crates: true

      - name: Install link tools
        run: |
          sudo apt-get update && sudo apt-get install -y mold clang
          mold --version || true

      - name: Build native bridge
        run: |
          sccache --start-server || true
          cargo build --release --locked -p pumpkin --verbose
          sccache --show-stats || true

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp target/release/pumpkin dist/pumpkin
          chmod +x dist/pumpkin
          # Record the exact source for bridge-compat checks (bridge pins
          # pumpkin revs; a struct drift here segfaults first FFI reads).
          git rev-parse HEAD > dist/SOURCE_REV
          grep '^version' crates/pumpkin/Cargo.toml | head -n 1 > dist/SOURCE_VERSION || true
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-linux-${{ github.sha }}
          path: dist/*
          retention-days: 7
